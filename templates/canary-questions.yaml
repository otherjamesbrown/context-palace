# Canary Question Starter Pack
#
# Generic retrieval-quality questions for any KB with:
#   - A playbook root with 3+ branches
#   - An architecture or overview branch
#   - At least one subsystem branch with operational content
#
# Usage:
#   cxp schedule seed-canaries --shard <canary-shard-id>
#
# After seeding, replace the placeholder source_kb values with your
# actual shard IDs, and tune expected_facts to match your KB content.
#
# Guidelines for good canary questions:
#   - 2-4 expected_facts per question (enough to verify the right article was returned)
#   - Mix keyword questions (exact terms from the article) and natural language questions
#   - Cover your highest-access articles and most critical subsystems
#   - Update after any KB renovation or major restructuring

- q: "What are the main knowledge domains or sections in this project's KB?"
  expected_facts:
    - playbook
    - branch
  source_kb: ""

