# Pipeline configuration for context-palace
# See: cxp pipeline setup --help

build:
    - cd cxp && go build ./...
test:
    - cd cxp && go test ./...
    - cd cxp && go vet ./...
agents:
    agent-mycroft:
        domains:
            - backend
            - services
    agent-steve:
        domains:
            - cli
            - migrations
dispatch:
    max_concurrent: 3
    tmux_session: main
    claude_flags: "--dangerously-skip-permissions"

monitoring:
    stall_timeout: 30m
    crash_check: true
    max_retries: 3
    cooldown: 5m
    actions:
        on_stall: skill:m-stall-check
        on_crash: redispatch
        on_max_retries: escalate

# Review process
review:
    ci:
        mode: ignore                     # no CI on this repo yet
        wait: false
    strategy: agent                      # spawn our own reviewer
    review_skill: m-review-pr            # skill for the review agent
    review_agent: agent-mycroft          # who reviews
github:
    owner_repo: otherjamesbrown/context-palace
skills_dir: skills

# Pipeline phases and gates
# Add a phase by adding an entry here + writing a skill file
phases:
    - name: design
      gates:
          - name: readiness-review
            skill: m-readiness-check
            fields:
                readiness: {type: int, min: 1, max: 5, required: true}
    - name: decompose
      gates:
          - name: decomposition-review
            skill: m-decomposition-review
            requires_label: integration-test
    - name: implement
    - name: review
    - name: done
